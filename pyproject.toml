[project]
name = "second-brain-evals"
version = "0.1.0"
description = "Reproducible agent-framework evaluations for Second Brain"
requires-python = ">=3.12"
dependencies = [
    "litellm==1.97.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
